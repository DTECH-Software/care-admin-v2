# Linode Object Storage (credentials must be provided only through environment variables)
wecare.object-storage.enabled=${WECARE_OBJECT_STORAGE_ENABLED:false}
wecare.object-storage.admin-write-enabled=${WECARE_ADMIN_OBJECT_STORAGE_WRITE_ENABLED:false}
wecare.object-storage.retain-database-copy=${WECARE_OBJECT_STORAGE_RETAIN_DATABASE_COPY:true}
wecare.object-storage.endpoint=${LINODE_OBJECT_STORAGE_ENDPOINT:}
# Linode's S3-compatible API uses the AWS signing region; the physical bucket
# location is selected by the endpoint (for example, sg-sin-1.linodeobjects.com).
wecare.object-storage.signing-region=${LINODE_OBJECT_STORAGE_SIGNING_REGION:us-east-1}
wecare.object-storage.bucket=${LINODE_OBJECT_STORAGE_BUCKET:}
wecare.object-storage.access-key=${LINODE_OBJECT_STORAGE_ACCESS_KEY:}
wecare.object-storage.secret-key=${LINODE_OBJECT_STORAGE_SECRET_KEY:}
wecare.object-storage.admin-prefix=${WECARE_ADMIN_OBJECT_STORAGE_PREFIX:admin}
