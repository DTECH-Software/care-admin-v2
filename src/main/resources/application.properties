spring.application.name=admin-care
server.servlet.context-path=/admin
server.port=8090

# Actuator health endpoints used by Docker and CI/CD.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Application logs are emitted to stdout for Docker log collection.
logging.level.root=INFO
logging.level.com.dtech.admin=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Colombo} %-5level [%thread] %logger{36} - %msg%n

#Database
spring.datasource.url=jdbc:mysql://172.237.89.148:3306/sgcs_care
spring.datasource.username=root
spring.datasource.password=DbUat@48Qm!Z7s
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.tomcat.max-wait=10000
spring.datasource.tomcat.max-active=50

# Controlled database upgrade from the previous production schema (Flyway baseline V1).
# Enable only for the migration deployment by setting WECARE_DB_MIGRATION_ENABLED=true.
spring.flyway.enabled=${WECARE_DB_MIGRATION_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=previous-version-schema
spring.flyway.validate-on-migrate=true

