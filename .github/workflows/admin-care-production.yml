name: Care Admin CI/CD (Production)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: care-admin-production
  cancel-in-progress: false

env:
  IMAGE_NAME: care-admin
  SERVICE_DIR: care-admin

jobs:
  build:
    name: Build production image
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application jar
        run: mvn -B -DskipTests clean package -Dspring.profiles.active=prod

      - name: Build immutable Docker image
        run: docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Export Docker image
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip -1 > care-admin-image.tar.gz

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: care-admin-production-${{ github.sha }}
          path: care-admin-image.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Download production image
        uses: actions/download-artifact@v4
        with:
          name: care-admin-production-${{ github.sha }}
          path: deployment

      - name: Add Compose file to deployment bundle
        run: cp docker-compose-prod.yml deployment/docker-compose-prod.yml

      - name: Copy deployment bundle to production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "deployment/*"
          target: "${{ secrets.PROD_DEPLOY_DIR }}/${{ env.SERVICE_DIR }}"
          strip_components: 1
          overwrite: true

      - name: Start production container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -eu
            SERVICE_DIR="${{ secrets.PROD_DEPLOY_DIR }}/${{ env.SERVICE_DIR }}"
            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            COMPOSE_FILE="$SERVICE_DIR/docker-compose-prod.yml"
            IMAGE_FILE="$SERVICE_DIR/care-admin-image.tar.gz"

            test -f "$COMPOSE_FILE"
            test -f "$IMAGE_FILE"
            test -f /opt/wecare/secrets/care-admin-production.env

            if ! docker ps --format '{{.Names}}' | grep -qx 'care-admin' \
               && ss -ltn | grep -q ':8090 '; then
              echo "Port 8090 is still used by the manual Java deployment. Complete the approved cutover before the first Docker deployment."
              exit 1
            fi

            docker load < "$IMAGE_FILE"
            CARE_ADMIN_IMAGE="$IMAGE" docker compose -f "$COMPOSE_FILE" config --quiet
            CARE_ADMIN_IMAGE="$IMAGE" docker compose -f "$COMPOSE_FILE" up -d --no-build care-admin

            for attempt in $(seq 1 36); do
              if curl -fsS --max-time 3 -o /dev/null "http://127.0.0.1:8090/admin/actuator/health"; then
                echo "care-admin production health check passed"
                rm -f "$IMAGE_FILE"
                exit 0
              fi
              echo "Waiting for care-admin production ($attempt/36)"
              sleep 5
            done

            echo "care-admin production health check failed"
            docker logs care-admin --tail 200 || true
            exit 1
