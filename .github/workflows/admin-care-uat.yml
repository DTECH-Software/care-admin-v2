name: Care Admin CI/CD (UAT)

on:
  push:
    branches: ["master", "develop" ]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "docker-compose-uat.yml"
      - ".github/workflows/admin-care-uat.yml"
  workflow_dispatch:

env:
  APP_NAME: admin-care
  SERVICE_DIR: care-admin

jobs:
  ci:
    name: Build care-admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        env:
          SPRING_PROFILES_ACTIVE: uat
        run: mvn -B -DskipTests clean package -Dspring.profiles.active=uat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: care-admin-jar
          path: target/*.jar
          if-no-files-found: error

  cd:
    name: Deploy care-admin to UAT
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: care-admin-jar
          path: ./artifact/${{ env.SERVICE_DIR }}

      - name: Ensure deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            rm -rf "${{ secrets.UAT_DEPLOY_DIR }}/${{ env.SERVICE_DIR }}/target"
            mkdir -p "${{ secrets.UAT_DEPLOY_DIR }}/${{ env.SERVICE_DIR }}/target"

      - name: Copy jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/${{ env.SERVICE_DIR }}/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/${{ env.SERVICE_DIR }}/target"
          strip_components: 2
          overwrite: true

      - name: Copy Docker files to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "Dockerfile,docker-compose-uat.yml"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/${{ env.SERVICE_DIR }}"
          overwrite: true

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            APP_NAME="${{ env.APP_NAME }}"
            SERVICE_DIR="${{ secrets.UAT_DEPLOY_DIR }}/${{ env.SERVICE_DIR }}"
            PID_FILE="$SERVICE_DIR/${APP_NAME}.pid"
            cd "$SERVICE_DIR"

            if [ ! -f "$SERVICE_DIR/docker-compose-uat.yml" ]; then
              echo "No docker-compose-uat.yml found in $SERVICE_DIR"
              exit 1
            fi
            if [ ! -f "$SERVICE_DIR/Dockerfile" ]; then
              echo "No Dockerfile found in $SERVICE_DIR"
              exit 1
            fi
            if ! find "$SERVICE_DIR/target" -type f -name "*.jar" | grep -q .; then
              echo "No jar found in $SERVICE_DIR/target"
              find "$SERVICE_DIR" -maxdepth 5 -type f | head -n 200 || true
              exit 1
            fi

            if [ -f "$PID_FILE" ]; then
              OLD_PID="$(cat "$PID_FILE" 2>/dev/null || true)"
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                OLD_CMD="$(ps -p "$OLD_PID" -o args= 2>/dev/null || true)"
                if echo "$OLD_CMD" | grep -Eq "java .*\.jar"; then
                  echo "Stopping old java process for ${APP_NAME}: $OLD_PID"
                  kill "$OLD_PID" || true
                  sleep 2
                else
                  echo "Skipping stale pid file for ${APP_NAME}: $OLD_PID is not a java jar process"
                fi
              fi
              rm -f "$PID_FILE"
            fi

            pgrep -f "java .*${SERVICE_DIR}/.*\.jar" | while read -r pid; do
              if [ "$pid" != "$$" ]; then
                echo "Stopping matching admin java process: $pid"
                kill "$pid" || true
              fi
            done || true
            pgrep -f "java .*admin-0.0.1.jar" | while read -r pid; do
              if [ "$pid" != "$$" ]; then
                echo "Stopping matching admin jar process: $pid"
                kill "$pid" || true
              fi
            done || true
            sleep 2

            docker --version
            docker compose version
            docker compose -f "$SERVICE_DIR/docker-compose-uat.yml" up -d --build care-admin
            docker compose -f "$SERVICE_DIR/docker-compose-uat.yml" ps

            for attempt in $(seq 1 36); do
              if curl -sS --max-time 3 -o /dev/null "http://127.0.0.1:8090/admin"; then
                echo "care-admin is responding on port 8090"
                exit 0
              fi
              echo "Waiting for care-admin ($attempt/36)"
              sleep 5
            done

            echo "care-admin did not become ready"
            docker logs care-admin --tail 200 || true
            exit 1
